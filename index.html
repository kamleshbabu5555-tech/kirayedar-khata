.sub{color:var(--mut);font-size:14px}

button:focus-visible,input:focus-visible,select:focus-visible,.btn:focus-visible{outline:3px solid var(--amb);outline-offset:1px}
.pri{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.dng{color:var(--red);border-color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.st{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.st b{display:block;font-size:22px;font-weight:800}
.st span{font-size:13px;color:var(--mut)}
.st.r b{color:var(--red)}.st.g b{color:var(--grn)}
input,select{width:100%;font:400 16px Mukta,system-ui,sans-serif;padding:9px 11px;border:1.5px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
.list{display:grid;gap:10px;margin-top:12px}
.rc{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;text-align:left;width:100%}
.rc:hover{border-color:var(--pri)}
.rc .n{font-weight:800;font-size:18px}
.bd{display:inline-block;border-radius:20px;padding:3px 11px;font-weight:700;font-size:14px;white-space:nowrap}
.bd.r{background:var(--redbg);color:var(--red)}.bd.g{background:var(--grnbg);color:var(--grn)}.bd.z{background:var(--bg);color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:36px 10px;border:2px dashed var(--bd);border-radius:12px}
.info{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
.big{font-size:30px;font-weight:800}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:15px}
th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:right;vertical-align:top}
th:nth-child(1),td:nth-child(1),th:nth-child(2),td:nth-child(2){text-align:left}
th{font-weight:700;color:var(--mut);font-size:13px}
td.d{color:var(--mut);font-size:13px}
.x{padding:2px 8px;border-radius:8px;color:var(--mut)}
.ov{position:fixed;inset:0;background:var(--ov);display:flex;align-items:flex-end;justify-content:center;z-index:50}
@media(min-width:640px){.ov{align-items:center}}
.md{background:var(--card);width:100%;max-width:480px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media(min-width:640px){.md{border-radius:16px}}
.md label{display:block;font-weight:600;font-size:14px;margin:10px 0 3px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--red);font-weight:600;margin-top:8px;min-height:1.2em}
.prev{background:var(--bg);border-radius:10px;padding:10px;margin-top:10px;font-size:15px}
.prev b{font-size:20px}
.mf{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
textarea{width:100%;min-height:110px;font:13px monospace;padding:8px;border:1.5px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
.note{font-size:13px;color:var(--mut);margin-top:18px}
h1,h2,.big,.rc .n,.st b{font-family:'Baloo 2',Mukta,system-ui,sans-serif}
.hero{background:var(--pri);color:var(--onpri);border-radius:18px;padding:16px 18px}
.hero h1{color:inherit}
.hero .sub{color:inherit;opacity:.85}
.hero .pri{background:var(--amb);border-color:var(--amb);color:#2A1A00}
.st{border-left:5px solid var(--pri);border-radius:6px 14px 14px 6px}
.st.r{border-left-color:var(--red)}.st.g{border-left-color:var(--grn)}

td:last-child{white-space:nowrap}
button.xw{border:0;background:none;padding:2px 6px;cursor:pointer;color:var(--grn);font:700 14px Mukta,system-ui,sans-serif}
.msg{white-space:pre-wrap;background:var(--bg);border-radius:12px;padding:12px;font-size:15px;margin:10px 0}
.rc{flex-wrap:wrap}
.rn{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.rn>div{background:var(--bg);border-radius:10px;padding:6px 10px}
.rn span{display:block;font-size:12px;color:var(--mut)}
.rn b{font-size:17px;font-weight:800}
.rn .rd{color:var(--red)}.rn .gt{color:var(--grn)}
@media(min-width:640px){.rn{width:auto;min-width:360px}}
</style>

<body>
<main id="app"></main>
<div id="m"></div>
<script>
const K='kirayedar_khata_v1';
let db={renters:[]},cur=null,q='',after=null;
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr=n=>'₹'+Math.abs(Math.round(n*100)/100).toLocaleString('en-IN');
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n};
function load(){try{const t=localStorage.getItem(K);if(t){const d=JSON.parse(t);if(d&&Array.isArray(d.renters))db=d}}catch(e){}}
function save(){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}}
const bal=r=>r.entries.reduce((s,e)=>s+(e.type==='bill'?e.amt:-e.amt),0);
const tot=r=>r.entries.reduce((s,e)=>{if(e.type==='bill')s.b+=e.amt;else s.p+=e.amt;return s},{b:0,p:0});
function rcStats(r){const t=tot(r),b=Math.round((t.b-t.p)*100)/100;return '<div class="rn"><div><span>Kul bill</span><b>'+inr(t.b)+'</b></div><div><span>Diya (jama)</span><b class="gt">'+inr(t.p)+'</b></div><div><span>'+(b<0?'Advance':'Baaki')+'</span><b class="'+(b>0?'rd':b<0?'gt':'')+'">'+inr(b)+'</b></div></div>'}
function badge(b){b=Math.round(b*100)/100;return b>0?`<span class="bd r">Bakaya ${inr(b)}</span>`:b<0?`<span class="bd g">Advance ${inr(b)}</span>`:`<span class="bd z">Hisab barabar</span>`}
const fd=d=>{if(!d)return'';const p=d.split('-');return p[2]+' '+MON[+p[1]-1]+' '+p[0].slice(2)};

function render(){
  const a=$('#app');
  const r=db.renters.find(x=>x.id===cur);
  if(cur&&r){detail(a,r)}else{cur=null;home(a)}
  window.scrollTo(0,0);
}
function home(a){
  let bak=0,adv=0,mon=0;const ym=today().slice(0,7);
  db.renters.forEach(r=>{const b=bal(r);if(b>0)bak+=b;else adv-=b;r.entries.forEach(e=>{if(e.type==='pay'&&e.date.slice(0,7)===ym)mon+=e.amt})});
  const list=db.renters.filter(r=>(r.name+' '+r.room).toLowerCase().includes(q.toLowerCase())).sort((x,y)=>bal(y)-bal(x));
  a.innerHTML=`<div class="top hero"><div><h1>Kirayedar Khata</h1><div class="sub">Kiraya, bijli bill, advance aur bakaya ka hisab</div></div>
  <button class="pri" id="add">+ Kirayedar jodo</button></div>
  <div class="stats"><div class="st"><b>${db.renters.length}</b><span>Kul kirayedar</span></div>
  <div class="st r"><b>${inr(bak)}</b><span>Kul bakaya</span></div>
  <div class="st g"><b>${inr(adv)}</b><span>Kul advance</span></div>
  <div class="st"><b>${inr(mon)}</b><span>Is mahine mila</span></div></div>
  ${db.renters.length>1?`<input id="q" placeholder="Naam ya room se khojo" value="${esc(q)}" aria-label="Khojo">`:''}
  <div class="list">${list.length?list.map(r=>`<button class="rc" data-id="${r.id}"><div class="rl"><div class="n">${esc(r.name)}</div><div class="sub">Room ${esc(r.room||'-')} · Kiraya ${inr(r.rent)}/mahina</div></div>${rcStats(r)}</button>`).join(''):`<div class="empty">${db.renters.length?'Koi kirayedar nahi mila.':'Abhi koi kirayedar nahi hai. Upar “Kirayedar jodo” dabakar pehla kirayedar jodein.'}</div>`}</div>
  <div class="note">Data isi browser mein save hota hai. <a href="#" id="bk">Backup / restore</a></div>`;
  $('#add').onclick=()=>renterForm();
  a.querySelectorAll('.rc').forEach(b=>b.onclick=()=>{cur=b.dataset.id;render()});
  const qi=$('#q');if(qi)qi.oninput=e=>{q=e.target.value;const p=e.target.selectionStart;home(a);const n=$('#q');n.focus();n.setSelectionRange(p,p)};
  $('#bk').onclick=e=>{e.preventDefault();backup()};
}
function detail(a,r){
  const b=bal(r);
  let run=0;const rows=r.entries.slice().sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:0).map(e=>{run+=e.type==='bill'?e.amt:-e.amt;return{e,run}}).reverse();
  const ph=(r.phone||'').replace(/\D/g,'');
  const wa=ph&&b>0?`https://wa.me/${ph.length===10?'91'+ph:ph}?text=${encodeURIComponent('Namaste '+r.name+', aapka '+inr(b)+' bakaya hai. Kripya jama kar dein. Dhanyavaad.')}`:'';
  a.innerHTML=`<div class="top"><button id="bk">← Wapas</button><button id="ed">Badlo</button></div>
  <h2>${esc(r.name)}</h2><div class="sub">Room ${esc(r.room||'-')}${r.phone?' · '+esc(r.phone):''} · Kiraya ${inr(r.rent)} · Bijli ${inr(r.rate)}/unit</div>
  <div class="info"><div class="sub">${b>0?'Baaki (bakaya)':b<0?'Advance jama':'Hisab'}</div><div class="big" style="color:${b>0?'var(--red)':b<0?'var(--grn)':'var(--tx)'}">${b===0?'Barabar':inr(b)}</div>
  <div class="acts"><button class="pri" id="bill">Mahine ka bill banao</button><button id="pay">Paisa jama karo</button>${wa?`<a class="btn wa" href="${wa}" target="_blank" rel="noopener">WhatsApp yaad dilao</a>`:''}<button class="dng" id="rm">Kirayedar hatao</button></div></div>
  <h2 style="font-size:17px;margin:16px 0 8px">Khata</h2>
  ${rows.length?`<div class="tw"><table><thead><tr><th>Tareekh</th><th>Vivaran</th><th>Bill</th><th>Jama</th><th>Baaki / Advance</th><th></th></tr></thead><tbody>${rows.map(({e,run})=>`<tr><td class="d">${fd(e.date)}</td><td>${esc(e.desc)}</td><td>${e.type==='bill'?inr(e.amt):''}</td><td>${e.type==='pay'?inr(e.amt):''}</td><td style="color:${run>0?'var(--red)':run<0?'var(--grn)':'inherit'}">${run>0?'Baaki ':run<0?'Adv ':''}${inr(run)}</td><td>${e.type==='bill'?`<button class="xw" data-snd="${e.id}">PDF bhejo</button> `:''}<button class="x" data-del="${e.id}" aria-label="Entry hatao">✕</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Abhi koi entry nahi. Pehla bill banayein ya paisa jama karein.</div>'}`;
  $('#bk').onclick=()=>{cur=null;render()};
  $('#ed').onclick=()=>renterForm(r);
  $('#bill').onclick=()=>billForm(r);
  $('#pay').onclick=()=>payForm(r);
  $('#rm').onclick=()=>removeRenter(r);
  a.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>delEntry(r,x.dataset.del));
  a.querySelectorAll('[data-snd]').forEach(x=>x.onclick=()=>sendModal(r,r.entries.find(z=>z.id===x.dataset.snd)));
}
function modal(title,body,okLabel,onOk){
  $('#m').innerHTML=`<div class="ov" id="ov"><div class="md" role="dialog" aria-modal="true"><h2>${title}</h2>${body}<div class="err" id="err"></div><div class="mf"><button id="cx">${okLabel?'Raddh karo':'Band karo'}</button>${okLabel?`<button class="pri" id="ok">${okLabel}</button>`:''}</div></div></div>`;
  const close=()=>{$('#m').innerHTML=''};
  $('#cx').onclick=close;
  $('#ov').onclick=e=>{if(e.target.id==='ov')close()};
  if(okLabel)$('#ok').onclick=()=>{const m=onOk();if(m)$('#err').textContent=m;else{close();render();if(after){const f=after;after=null;f()}}};
  const f=$('#m input,#m textarea');if(f)f.focus();
}
const fld=(id,l,t,v,x)=>`<label for="${id}">${l}</label><input id="${id}" type="${t||'text'}" value="${esc(v==null?'':v)}" ${x||''}>`;
const val=id=>$('#'+id).value.trim();

function renterForm(r){
  const n=!r;
  modal(n?'Naya kirayedar jodo':'Kirayedar ki jaankari badlo',
   fld('nm','Naam','text',r&&r.name)+`<div class="row"><div>${fld('rm_','Room / Flat','text',r&&r.room)}</div><div>${fld('ph','Mobile','tel',r&&r.phone,'inputmode="numeric"')}</div></div>
   <div class="row"><div>${fld('rt','Mahine ka kiraya (₹)','number',r&&r.rent,'inputmode="decimal"')}</div><div>${fld('rr','Bijli rate (₹/unit)','number',r?r.rate:'','inputmode="decimal"')}</div></div>
   ${n?`<div class="row"><div>${fld('mt','Shuru meter reading','number','','inputmode="decimal"')}</div><div>${fld('ad','Advance mila (₹)','number','','inputmode="decimal"')}</div></div>${fld('dt','Tareekh','date',today())}`:fld('mt','Shuru meter reading','number',r.meter,'inputmode="decimal"')}`,
   n?'Jodo':'Save karo',()=>{
    if(!val('nm'))return 'Kirayedar ka naam likhein.';
    if(num(val('rt'))<=0)return 'Mahine ka kiraya likhein.';
    const o={name:val('nm'),room:val('rm_'),phone:val('ph'),rent:num(val('rt')),rate:num(val('rr')),meter:num(val('mt'))};
    if(n){const nr=Object.assign({id:uid(),entries:[]},o);
      if(num(val('ad'))>0)nr.entries.push({id:uid(),date:val('dt')||today(),type:'pay',desc:'Advance jama',amt:num(val('ad'))});
      db.renters.push(nr);cur=nr.id}else Object.assign(r,o);
    save();
  });
}
function lastReading(r){const l=r.entries.filter(e=>e.type==='bill'&&e.reading!=null).sort((a,b)=>a.date<b.date?-1:1).pop();return l?l.reading:r.meter}
function billForm(r){
  const prev=lastReading(r);
  modal('Mahine ka bill — '+esc(r.name),
   `<div class="row"><div>${fld('bm','Mahina','month',today().slice(0,7))}</div><div>${fld('br','Kiraya (₹)','number',r.rent,'inputmode="decimal"')}</div></div>
   <div class="row"><div>${fld('bp','Pichhli reading','number',prev,'inputmode="decimal"')}</div><div>${fld('bc','Abhi ki reading','number','','inputmode="decimal"')}</div></div>
   <div class="row"><div>${fld('bo','Paani / maintenance / anya (₹)','number','','inputmode="decimal"')}</div><div>${fld('bn','Anya ka naam','text','')}</div></div>
   <div class="prev" id="pv"></div>`,'Bill banao',()=>{
    const c=calc();if(c.err)return c.err;
    const [y,mo]=val('bm').split('-');
    const parts=['Kiraya '+inr(c.rent)];if(c.cur!=null)parts.push('Bijli '+c.units+' unit × '+inr(r.rate)+' = '+inr(c.elec));if(c.oth>0)parts.push((val('bn')||'Anya')+' '+inr(c.oth));
    const ne={id:uid(),date:val('bm')+'-01',type:'bill',desc:MON[+mo-1]+' '+y+': '+parts.join(' + '),amt:c.total,reading:c.cur,title:MON[+mo-1]+' '+y,parts:parts,rent:c.rent,oth:c.oth,othName:val('bn'),units:c.units,elec:c.elec,prev:c.prev,rate:r.rate};r.entries.push(ne);after=()=>sendModal(r,ne);
    save();
  });
  function calc(){
    const rent=num(val('br')),oth=num(val('bo')),p=num(val('bp')),hasC=val('bc')!=='';const cu=num(val('bc'));
    if(!val('bm'))return{err:'Mahina chunein.'};
    if(hasC&&cu<p)return{err:'Abhi ki reading pichhli reading se kam nahi ho sakti.'};
    const units=hasC?Math.round((cu-p)*100)/100:0,elec=Math.round(units*r.rate*100)/100;
    return{rent,oth,units,elec,prev:p,cur:hasC?cu:null,total:rent+elec+oth};
  }
  const upd=()=>{const c=calc();$('#pv').innerHTML=c.err?'<span class="sub">'+c.err+'</span>':`Bijli: ${c.units} unit = ${inr(c.elec)}<br>Kul bill: <b>${inr(c.total)}</b>`};
  document.querySelectorAll('#m input').forEach(i=>i.oninput=upd);upd();
}
function payForm(r){
  const b=bal(r);
  modal('Paisa jama karo — '+esc(r.name),
   fld('pa','Rakam (₹)','number',b>0?b:'','inputmode="decimal"')+`<div class="row"><div>${fld('pd','Tareekh','date',today())}</div><div><label for="pmode">Kaise mila</label><select id="pmode"><option>Cash</option><option>UPI</option><option>Bank</option></select></div></div>`+fld('pn','Note (zaroori nahi)','text','')+
   `<div class="sub" style="margin-top:8px">Bakaya se zyada rakam dene par bacha hua paisa advance ban jayega.</div>`,'Jama karo',()=>{
    const a=num(val('pa'));if(a<=0)return 'Rakam likhein.';
    r.entries.push({id:uid(),date:val('pd')||today(),type:'pay',desc:'Jama ('+$('#pmode').value+')'+(val('pn')?' — '+val('pn'):''),amt:a});save();
  });
}
function waUrl(r,text){const ph=(r.phone||'').replace(/\D/g,'');return 'https://wa.me/'+(ph?(ph.length===10?'91'+ph:ph):'')+'?text='+encodeURIComponent(text)}
function billMsg(r,e){
  let run=0;for(const x of r.entries.slice().sort((p,q2)=>p.date<q2.date?-1:p.date>q2.date?1:0)){run+=x.type==='bill'?x.amt:-x.amt;if(x.id===e.id)break}
  const lines=e.parts||[e.desc];
  return '*Kiraya Bill — '+(e.title||fd(e.date))+'*\nNamaste '+r.name+' ji (Room '+(r.room||'-')+')\n\n'+lines.map(l=>'• '+l).join('\n')+'\n\n*Is mahine ka bill: '+inr(e.amt)+'*\n'+(run>0?'Ab tak kul baaki: '+inr(run):run<0?'Aapka advance jama: '+inr(run):'Hisab barabar hai')+'\n\nDhanyavaad 🙏';
}
function sendModal(r,e){
  const t=billMsg(r,e);
  modal('Bill taiyar hai','<div class="sub">'+esc(r.name)+(r.phone?' ('+esc(r.phone)+')':'')+' ke liye '+esc(e.title||fd(e.date))+' ka bill. PDF mein kiraya, bijli ka bill, kul jama aur baaki sab likha hoga.</div><div class="msg">'+esc(t)+'</div><div class="acts"><button class="btn wa" id="pdfb">PDF banao aur WhatsApp par bhejo</button><a class="btn" href="'+esc(waUrl(r,t))+'" target="_blank" rel="noopener">Sirf message bhejo</a></div><div class="sub" id="pe" style="margin-top:10px"></div><a class="btn wa" id="wl" style="display:none;margin-top:8px" href="'+esc(waUrl(r,'Namaste '+r.name+' ji, aapka '+(e.title||'')+' ka kiraya bill PDF mein bhej raha hoon.'))+'" target="_blank" rel="noopener">WhatsApp kholo</a>',null);
  $('#pdfb').onclick=()=>sendPdf(r,e);
}
function wrapT(c,s,w){const out=[];let l='';String(s).split(' ').forEach(wd=>{const t=l?l+' '+wd:wd;if(c.measureText(t).width>w&&l){out.push(l);l=wd}else l=t});if(l)out.push(l);return out}
async function makePdf(r,e){
  try{await Promise.all([document.fonts.load('400 16px Mukta'),document.fonts.load('700 16px Mukta')])}catch(x){}
  const cv=document.createElement('canvas');cv.width=1240;cv.height=1754;
  const c=cv.getContext('2d'),S=1240/210;c.scale(S,S);
  const W=210,M=16,R=W-M,F='Mukta,system-ui,sans-serif';
  const rs=n=>'₹'+Math.abs(Math.round(n*100)/100).toLocaleString('en-IN');
  const tx=(s,x,y,o)=>{o=o||{};c.font=(o.b?'700 ':'400 ')+(o.s||4.3)+'px '+F;c.fillStyle=o.c||'#1D1B33';c.textAlign=o.a||'left';c.fillText(s,x,y)};
  const box=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(x,y,w,h)};
  const sorted=r.entries.slice().sort((p,q2)=>p.date<q2.date?-1:p.date>q2.date?1:0);
  const tb=sorted.filter(x=>x.type==='bill').reduce((s,x)=>s+x.amt,0),tp=sorted.filter(x=>x.type==='pay').reduce((s,x)=>s+x.amt,0),b=Math.round((tb-tp)*100)/100;
  box(0,0,W,297,'#FFFFFF');box(0,0,W,32,'#3730A3');
  tx('KIRAYA BILL',M,16,{b:1,s:9,c:'#FFFFFF'});
  tx(e.title||fd(e.date),M,25,{s:4.6,c:'#FFFFFF'});
  tx('Tareekh: '+fd(today()),R,25,{s:4.2,c:'#FFFFFF',a:'right'});
  tx(r.name,M,45,{b:1,s:6});
  tx('Room: '+(r.room||'-')+(r.phone?'    Mobile: '+r.phone:''),M,52,{s:4.2,c:'#66647E'});
  let y=64;
  const row=(a,v,o)=>{o=o||{};if(o.f)box(M,y-5.6,R-M,9,o.f);tx(a,M+2,y,{b:o.b,s:o.s,c:o.c});if(v!=='')tx(v,R-2,y,{b:o.b,s:o.s,c:o.c,a:'right'});y+=o.g||9};
  row('Vivaran','Rakam',{f:'#EDECFA',b:1});
  if(e.rent!=null){
    row('Kiraya',rs(e.rent));
    if(e.reading!=null){row('Bijli ka bill',rs(e.elec),{g:5.5});tx('Reading '+e.prev+' se '+e.reading+' tak: '+e.units+' unit × '+rs(e.rate)+' per unit',M+2,y,{s:3.4,c:'#66647E'});y+=6.5}
    if(e.oth>0)row('Anya kharcha'+(e.othName?' ('+e.othName+')':''),rs(e.oth));
  }else{c.font='400 4.2px '+F;(e.parts||[e.desc]).forEach(p=>wrapT(c,p,R-M-4).forEach(l=>{tx(l,M+2,y);y+=6}));y+=3}
  row('Is mahine ka kul bill',rs(e.amt),{f:'#EDECFA',b:1,s:5,g:15});
  tx('Aaj tak ka hisab',M,y,{b:1,s:5.2,c:'#3730A3'});y+=9;
  row('Kul bill (shuru se ab tak)',rs(tb));
  row('Kul jama kiya (shuru se ab tak)',rs(tp));
  row(b>0?'Baaki (dena hai)':b<0?'Advance (aapka jama)':'Hisab',b===0?'Barabar':rs(b),{b:1,s:5.4,c:b>0?'#B3261E':b<0?'#1B7F4B':'#1D1B33',f:b>0?'#FBE9E7':b<0?'#E3F4EA':'#F3F2FA',g:15});
  const pays=sorted.filter(x=>x.type==='pay').slice(-10);
  if(pays.length){tx('Jama ki tafseel',M,y,{b:1,s:5.2,c:'#3730A3'});y+=9;pays.forEach(x=>row(fd(x.date)+'   '+String(x.desc).slice(0,60),rs(x.amt),{s:3.9,g:7.5}))}
  tx('Dhanyavaad',M,y+8,{s:4,c:'#66647E'});
  const D=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
  D.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',0,0,210,297);
  return D.output('blob');
}
async function sendPdf(r,e){
  const pe=$('#pe');pe.textContent='PDF ban rahi hai...';
  if(!(window.jspdf&&window.jspdf.jsPDF)){pe.textContent='PDF banane ka tool load nahi hua. Internet check karke page dobara kholein.';return}
  let blob;try{blob=await makePdf(r,e)}catch(x){pe.textContent='PDF nahi ban payi. Dobara koshish karein.';return}
  const nm='Bill-'+(e.title||'kiraya').replace(/\s+/g,'-')+'-'+(String(r.name).replace(/[^A-Za-z0-9]+/g,'')||'kirayedar')+'.pdf';
  const file=new File([blob],nm,{type:'application/pdf'});
  if(NATIVE){try{const P=Capacitor.Plugins;const b64=await new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>ok(String(fr.result).split(',')[1]);fr.onerror=no;fr.readAsDataURL(blob)});const w=await P.Filesystem.writeFile({path:nm,data:b64,directory:'CACHE'});await P.Share.share({title:'Kiraya Bill',files:[w.uri],dialogTitle:'Bill bhejein'});pe.textContent=''}catch(x){const m=String((x&&x.message)||x);pe.textContent=/cancel/i.test(m)?'':'PDF share nahi ho payi. Dobara koshish karein.'}return}
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Kiraya Bill'});pe.textContent='';return}}catch(x){if(x&&x.name==='AbortError'){pe.textContent='';return}}
  try{const dl=window.claude&&await claude.use('downloads');if(dl){await dl.save({filename:nm,data:blob});pe.textContent='PDF save ho gayi. Ab neeche ke button se WhatsApp kholein aur save hui PDF ko attach (📎) karke bhej dein.';$('#wl').style.display='inline-block';return}}catch(x){if(x&&x.code==='declined'){pe.textContent='';return}}
  pe.textContent='Is jagah PDF save nahi ho paayi. “Sirf message bhejo” se text bhej sakte hain.';
}
function delEntry(r,id){
  modal('Entry hatao?','<p>Yeh entry khata se hat jayegi aur baaki dobara ginaa jayega.</p>','Haan, hatao',()=>{r.entries=r.entries.filter(e=>e.id!==id);save()});
}
function removeRenter(r){
  const b=bal(r);
  modal('Kirayedar hatao?',`<p><b>${esc(r.name)}</b> aur unka poora khata hamesha ke liye hat jayega.</p>${b>0?`<p style="color:var(--red)">Dhyan dein: ${inr(b)} bakaya abhi baaki hai.</p>`:b<0?`<p style="color:var(--grn)">Dhyan dein: ${inr(b)} advance wapas karna baaki hai.</p>`:''}`,'Haan, hatao',()=>{db.renters=db.renters.filter(x=>x.id!==r.id);cur=null;save()});
}
function backup(){
  modal('Backup / restore',`<div class="sub">Neeche ka text copy karke kahin rakh lein. Naye phone ya browser mein wahi text paste karke restore karein.</div><label for="bt">Backup text</label><textarea id="bt">${esc(JSON.stringify(db))}</textarea>`,'Restore karo',()=>{
    try{const d=JSON.parse($('#bt').value);if(!d||!Array.isArray(d.renters))return 'Yeh sahi backup nahi hai.';db=d;cur=null;save()}catch(e){return 'Yeh sahi backup nahi hai.'}
  });
}
const NATIVE=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href^="http"]');if(a&&NATIVE){e.preventDefault();window.location.href=a.href}});
load();render();
</script>
