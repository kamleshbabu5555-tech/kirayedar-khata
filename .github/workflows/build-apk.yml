name: APK banao

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Packages install
        run: npm install

      - name: App files tayyar karo
        run: |
          mkdir -p www assets
          cp index.html jspdf.umd.min.js www/
          cp icon-only.png icon-foreground.png icon-background.png assets/

      - name: Android project banao
        run: npx cap add android

      - name: Icon lagao
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#3730A3' --iconBackgroundColorDark '#3730A3'

      - name: Sync
        run: npx cap sync android

      - name: APK build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK ka naam badlo
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Kirayedar-Khata.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Kirayedar-Khata-APK
          path: Kirayedar-Khata.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Kirayedar Khata APK ${{ github.run_number }}
          files: Kirayedar-Khata.apk
